name: Build and Analyze iOS App

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and SonarCloud
    runs-on: macos-13  # Folosește o versiune de macOS disponibilă pe GitHub Actions.
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Asigură că întreg istoricul repo-ului este disponibil pentru build.

      - name: Set up Xcode
        run: |
          # Verifică și selectează ultima versiune de Xcode disponibilă
          sudo xcode-select -s /Applications/Xcode.app  # Folosește Xcode-ul implicit disponibil pe runner
          sudo xcodebuild -license accept  # Acceptă termenii licenței Xcode dacă nu sunt deja acceptați

      - name: Build with xcodebuild
        run: |
          xcodebuild clean build \
            -project moldgag-ios-app-swift.xcodeproj \
            -scheme moldgag-ios-app-swift \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -sdk iphonesimulator  # Folosește simulatorul pentru build.

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=moldgag_moldgag-ios-app-swift
            -Dsonar.organization=moldgag
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.
            -Dsonar.language=swift
            -Dsonar.exclusions=**/Pods/**,**/Tests/**
            -Dsonar.swift.coverage.reportPath=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Token-ul SonarCloud pentru autentificare.
