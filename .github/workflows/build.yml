name: Build and Analyze iOS App

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and SonarCloud
    runs-on: macos-13  # Xcode 15.2+ e pe macos-13, dar poți ajusta dacă folosești altă versiune
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Faci fetch complet al istoriei pentru un build mai precis

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app  # Înlocuiește cu versiunea corectă dacă ai o altă versiune

      - name: Clean DerivedData
        run: |
          echo "Cleaning DerivedData..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/*  # Curăță tot DerivedData pentru a evita conflictele

      - name: Clean and Build with xcodebuild
        run: |
          xcodebuild clean build \
            -project moldgag-ios-app-swift.xcodeproj \
            -scheme moldgag-ios-app-swift \
            -destination 'platform=iOS Simulator,name=iPhone 16'

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >
            -Dsonar.projectKey=moldgag_moldgag-ios-app-swift
            -Dsonar.organization=moldgag
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=.
            -Dsonar.language=swift
            -Dsonar.exclusions=**/Tests/**  # Am eliminat Pods din exclusions, dar păstrează pentru alte fișiere neimportante
            -Dsonar.swift.coverage.reportPath=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
